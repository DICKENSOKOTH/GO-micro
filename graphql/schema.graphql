scalar Time

type Account{
    id: String!
    name: String!
    orderS: [order!]!
}

type Product{
    id: String!
    name: String!
    description: String!
    price: Float!
}

type order{
    id: String!
    createdAt: Time!
    totalPrice: Float!
    products: [OrderedProduct!]!
}

type OrderedProduct{
    id: String!
    name: String!
    description: String!
    price: Float!
    quantity: Int!
}

input PaginationInput{
    skip: Int
    take: Int
}
input AccountInput{
    name: String!
}

input ProductInput{
    name: String!
    description: String!
    price: Float!
}

input OrderProductInput{
    id: String!
    quantity: Int!
}

input OrderInput{
    accountId: String!
    products: [OrderedProductInput!]!
}

type Mutation{
    craeteAccount(account: AccountInput!): Account
    createProduct(product: ProductInput!): product
    createOrder(order: OrderInput!): Order
}

type Query{
    accounts(pagination: PaginationInput, id: String): [Account!]!
    products(pagination: PaginationInput, query: String, id: String): [Product!]!
}